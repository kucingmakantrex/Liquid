name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip proyek
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Mengekstrak $ZIP"
          unzip -q -o "$ZIP" -d _src
          # masuk ke folder yang berisi settings.gradle (berapa pun kedalamannya)
          PROJ=$(dirname "$(find _src -name settings.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HiOS-Liquid-Glass
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
